<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='82' text-anchor='middle' font-size='86'%3E%F0%9F%8F%85%3C/text%3E%3C/svg%3E"
    />
    <title>Vincents Plan: Physik × Informatik</title>
  </head>
  <body>
    <div class="w">
      <header>
        <div>
          <div class="pr">
            <b>vincent@uni-goettingen</b>:~/2fb-lehramt$
            <span class="pr-command">status <i aria-hidden="true"></i></span>
          </div>
          <h1><u>Physik</u> × <s>Informatik</s></h1>
        </div>
        <div class="acts">
          <div class="seg" id="mode">
            <button data-mode="plan">Vincents Plan</button
            ><button data-mode="all">Alle Optionen</button>
          </div>
          <button class="btn" id="bDemo">Plan abhaken</button>
          <button class="btn" id="bSave">Sichern</button>
          <button class="btn" id="bLoad" title="Vorhandene Haken durch eine Sicherung ersetzen">
            Laden
          </button>
          <input type="file" id="backupFile" accept="application/json,.json" hidden />
          <button class="btn" id="bCopy">Kopieren</button>
          <button class="btn warn" id="bReset">Zurücksetzen</button>
          <button class="btn" id="bTheme" aria-label="Hell/Dunkel wechseln">Hell/Dunkel</button>
        </div>
      </header>
      <main class="dashboard">
        <aside id="dyn" class="dashboard-summary" aria-label="Studienübersicht"></aside>
        <section class="module-panel" aria-label="Modulliste">
          <div class="bar2">
            <input
              id="q"
              type="search"
              placeholder="grep: Modul, Code, Stichwort"
              aria-label="Modul suchen"
            />
            <div class="seg" id="seg">
              <button data-st="all">Alle</button><button data-st="open">Offen</button
              ><button data-st="done">Absolviert</button>
            </div>
          </div>
          <div id="list" class="module-grid" tabindex="-1"></div>
        </section>
      </main>
      <pre class="print-report" id="printReport"></pre>
      <footer></footer>
    </div>
    <div id="toast" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vincents Plan: Physik × Informatik</title>
  </head>
  <body>
    <div class="w">
      <header>
        <div>
          <div class="pr"><b>vincent@uni-goettingen</b>:~/2fb-lehramt$ status <i></i></div>
          <h1><u>Physik</u> × <s>Informatik</s></h1>
        </div>
        <div class="acts">
          <div class="seg" id="mode">
            <button data-mode="plan">Vincents Plan</button
            ><button data-mode="all">Alle Optionen</button>
          </div>
          <button class="btn" id="bDemo">Plan abhaken</button>
          <button class="btn" id="bCopy">Kopieren</button>
          <button class="btn warn" id="bReset">Zurücksetzen</button>
          <button class="btn" id="bTheme" aria-label="Hell/Dunkel wechseln">Hell/Dunkel</button>
        </div>
      </header>
      <div id="dyn"></div>
      <div class="bar2">
        <input
          id="q"
          type="search"
          placeholder="grep: Modul, Code, Stichwort"
          aria-label="Modul suchen"
        />
        <div class="seg" id="seg">
          <button data-st="all">Alle</button><button data-st="open">Offen</button
          ><button data-st="done">Absolviert</button>
        </div>
      </div>
      <div id="list"></div>
      <footer></footer>
    </div>
    <div id="toast" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
